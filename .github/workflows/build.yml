name: Build Dokios

on:
  push:
    branches: [main, doki-os]
    tags: ['dokios-v*']
  workflow_dispatch:

concurrency:
  group: dokios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-packages:
    name: Build APKs (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            alpine_img: alpine:3.24
          - arch: aarch64
            runner: ubuntu-24.04-arm
            alpine_img: alpine:3.24
    steps:
      - uses: actions/checkout@v4

      - name: Build in Alpine container
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.alpine_img }}
          options: -v ${{ github.workspace }}:/work -w /work --privileged
          run: |
            apk update
            apk add --no-cache abuild build-base apk-tools alpine-conf git sudo fakeroot linux-headers bc bison flex elfutils-dev openssl-dev perl python3 bash
            addgroup -S abuild
            adduser -S -G abuild -h /home/builder -s /bin/sh builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
            mkdir -p /home/builder/.abuild
            openssl genrsa -out /home/builder/.abuild/ci.rsa 2048 2>/dev/null
            openssl rsa -in /home/builder/.abuild/ci.rsa -pubout -out /home/builder/.abuild/ci.rsa.pub 2>/dev/null
            cp /home/builder/.abuild/ci.rsa.pub /etc/apk/keys/
            echo 'PACKAGER_PRIVKEY="/home/builder/.abuild/ci.rsa"' > /home/builder/.abuild/abuild.conf
            echo 'REPODEST="/home/builder/packages"' >> /home/builder/.abuild/abuild.conf
            chown -R builder:abuild /home/builder/.abuild

            echo "==> Building kernel..."
            cd /work/doki/doki-os-kernel
            CARCH=${{ matrix.arch }} su builder -c "abuild -F checksum" || echo "⚠️ checksum skip"
            CARCH=${{ matrix.arch }} su builder -c "abuild -F -r -d" || echo "⚠️ kernel build skip"

            echo "==> Building meta-packages..."
            for pkg in doki dokid doki-compose doki-init doki-kube doki-kubectl doki-os-base doki-os-vm; do
              echo "  -> $pkg"
              cd /work/doki/$pkg
              CARCH=${{ matrix.arch }} su builder -c "abuild -F checksum" 2>/dev/null || true
              CARCH=${{ matrix.arch }} su builder -c "abuild -F -r -d" 2>/dev/null || true
              cd /work
            done

            echo "==> Creating repo..."
            mkdir -p /work/repo/main/${{ matrix.arch }}
            find /home/builder/packages -name '*.apk' -exec cp {} /work/repo/main/${{ matrix.arch }}/ \; 2>/dev/null || true
            if ls /work/repo/main/${{ matrix.arch }}/*.apk >/dev/null 2>&1; then
              cd /work/repo/main/${{ matrix.arch }}
              apk index -o APKINDEX.tar.gz *.apk 2>/dev/null || true
            fi
            echo "Done building for ${{ matrix.arch }}"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: repo/
          retention-days: 14

  build-images:
    name: Build Images (${{ matrix.arch }})
    needs: build-packages
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            alpine_img: alpine:3.24
          - arch: aarch64
            runner: ubuntu-24.04-arm
            alpine_img: alpine:3.24
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          name: packages-${{ matrix.arch }}
          path: packages/
        continue-on-error: true

      - name: Build images in Alpine
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.alpine_img }}
          options: -v ${{ github.workspace }}:/work -w /work --privileged
          run: |
            apk update
            apk add --no-cache alpine-conf apk-tools busybox fakeroot syslinux xorriso grub mtools dosfstools squashfs-tools e2fsprogs cpio git bash sudo
            mkdir -p output
            
            echo "==> Building initramfs..."
            ./scripts/mkimage.sh --arch ${{ matrix.arch }} --profile doki_os_initramfs --repository ./packages/main/${{ matrix.arch }} --repository https://dl-cdn.alpinelinux.org/alpine/edge/main --repository https://dl-cdn.alpinelinux.org/alpine/edge/community --outdir output/ --tag ${{ github.sha }} 2>&1 | tail -10
            echo "==> Output:"
            ls -lh output/

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: dokios-images-${{ matrix.arch }}
          path: output/
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/dokios-v')
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all
        uses: actions/download-artifact@v5
        with:
          path: release/
          pattern: dokios-images-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          sha512sum * > SHA512SUMS.txt 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "doki-OS v0.1"
          body: |
            ## doki-OS v0.1 — Container-Optimized OS
            
            Based on Alpine Linux 3.24 with Linux Kernel 7.1.
            
            ### Included
            - **Kernel 7.1** (container-optimized, Wi-Fi enabled)
            - **Container features**: namespaces, cgroups v2, overlayfs, seccomp
            - **Networking**: iproute2, nftables, wpa_supplicant
            - **Storage**: fuse-overlayfs
            - **Package manager**: apk (Alpine edge repos)
            
            ### Quick Start
            ```bash
            qemu-system-aarch64 \
              -kernel vmlinuz-doki-os \
              -initrd doki-os-initramfs-aarch64.tar.gz \
              -append "console=ttyAMA0 init=/sbin/doki-init" \
              -m 512 -nographic
            ```
          files: release/*
          generate_release_notes: false
          prerelease: false
