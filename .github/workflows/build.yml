name: Build and Release Dokios

on:
  push:
    branches: [main, doki-os]
    tags: ['dokios-v*']
  workflow_dispatch:

concurrency:
  group: dokios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: Build Kernel (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
          - arch: aarch64
    container:
      image: alpine:edge
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          apk update
          apk add --no-cache alpine-sdk build-base bc bison flex openssl-dev elfutils-dev gmp-dev mpc1-dev mpfr-dev perl linux-headers findutils diffutils installkernel zstd python3 bash sudo pahole

      - name: Setup abuild
        run: |
          addgroup root abuild
          mkdir -p /root/.abuild
          openssl genrsa -out /root/.abuild/ci.rsa 2048 2>/dev/null
          openssl rsa -in /root/.abuild/ci.rsa -pubout -out /root/.abuild/ci.rsa.pub 2>/dev/null
          cp /root/.abuild/ci.rsa.pub /etc/apk/keys/
          echo 'PACKAGER_PRIVKEY="/root/.abuild/ci.rsa"' > /root/.abuild/abuild.conf
          echo 'PACKAGER="DokiOS CI"' >> /root/.abuild/abuild.conf
          echo 'REPODEST="/root/packages"' >> /root/.abuild/abuild.conf

      - name: Build kernel
        working-directory: doki/doki-os-kernel
        run: |
          CARCH=${{ matrix.arch }} abuild -F checksum
          CARCH=${{ matrix.arch }} abuild -F -r
          echo "=== Built kernel packages ==="
          find /root/packages -name "*.apk" -exec ls -lh {} \;

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: /root/packages/
          retention-days: 30

  build-rootfs:
    name: Build Rootfs (${{ matrix.arch }})
    needs: build-kernel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
          - arch: aarch64
    container:
      image: alpine:edge
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: apk update && apk add --no-cache bash

      - name: Download kernel packages
        uses: actions/download-artifact@v5
        with:
          name: kernel-${{ matrix.arch }}
          path: kernel-pkgs/

      - name: Build rootfs
        run: |
          mkdir -p output
          cp scripts/genrootfs.sh /tmp/
          /tmp/genrootfs.sh \
            -a ${{ matrix.arch }} \
            -o output/dokios-minirootfs-${{ matrix.arch }}.tar.gz \
            busybox alpine-baselayout alpine-keys alpine-release apk-tools musl-utils \
            iproute2 nftables fuse-overlayfs wireless-tools wpa_supplicant ca-certificates-bundle 2>&1 | tail -5
          ls -lh output/

      - name: Upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: dokios-${{ matrix.arch }}
          path: output/
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/dokios-v')
    needs: build-rootfs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all
        uses: actions/download-artifact@v5
        with:
          path: release/
          pattern: dokios-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "doki-OS v0.1"
          body: |
            ## doki-OS v0.1 — Container-Optimized OS
            
            Based on Alpine Linux 3.24 with Linux Kernel 7.1.
            
            ### Included
            - Kernel 7.1 (container-optimized, Wi-Fi, namespaces, cgroups v2, overlayfs, seccomp)
            - Alpine 3.24 base with iproute2, nftables, fuse-overlayfs, wpa_supplicant
            - APK package manager with edge repos
            
            ### Quick Start
            ```bash
            tar xzf dokios-minirootfs-aarch64.tar.gz -C rootfs/
            chroot rootfs /bin/ash
            ```
          files: release/*
          prerelease: false
