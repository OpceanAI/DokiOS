name: Build and Release Dokios

on:
  push:
    branches: [main, doki-os]
    tags: ['dokios-v*']
  workflow_dispatch:

concurrency:
  group: dokios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: Build Kernel (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            apk_arch: x86_64
          - arch: aarch64
            apk_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Alpine for ${{ matrix.apk_arch }}
        uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.apk_arch }}
          branch: edge
          packages: >
            alpine-sdk build-base bc bison flex
            openssl-dev elfutils-dev gmp-dev mpc1-dev mpfr-dev
            perl linux-headers findutils diffutils installkernel
            zstd python3 pahole sed mawk grep tar xz
          shell-name: alpine.sh

      - name: Setup abuild
        shell: alpine.sh {0}
        run: |
          adduser -D builder
          addgroup builder abuild
          su builder -c "abuild-keygen -a -n"
          cp /home/builder/.abuild/*.rsa.pub /etc/apk/keys/

      - name: Build kernel
        shell: alpine.sh {0}
        working-directory: doki/doki-os-kernel
        run: |
          su builder -c "CARCH=${{ matrix.arch }} abuild -F checksum"
          su builder -c "CARCH=${{ matrix.arch }} abuild -F -r -d"
          find /home/builder/packages -name '*.apk' -ls

      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: /home/builder/packages/
          retention-days: 30

  build-rootfs:
    name: Build Rootfs (${{ matrix.arch }})
    needs: build-kernel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            apk_arch: x86_64
          - arch: aarch64
            apk_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.apk_arch }}
          branch: edge
          packages: bash
          shell-name: alpine.sh

      - name: Build rootfs
        shell: alpine.sh {0}
        run: |
          mkdir -p output
          cp scripts/genrootfs.sh /tmp/genrootfs.sh
          chmod +x /tmp/genrootfs.sh
          /tmp/genrootfs.sh \
            -a ${{ matrix.arch }} \
            -o output/dokios-minirootfs-${{ matrix.arch }}.tar.gz \
            busybox alpine-baselayout alpine-keys alpine-release apk-tools musl-utils \
            iproute2 nftables fuse-overlayfs wireless-tools wpa_supplicant ca-certificates-bundle 2>&1 | tail -5
          ls -lh output/

      - name: Upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: dokios-${{ matrix.arch }}
          path: output/
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/dokios-v')
    needs: build-rootfs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all
        uses: actions/download-artifact@v5
        with:
          path: release/
          pattern: dokios-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "doki-OS v0.1"
          body: |
            ## doki-OS v0.1 — Container-Optimized OS
            
            Based on Alpine Linux 3.24 with Linux Kernel 7.1.
            
            ### Included
            - Kernel 7.1 (container-optimized: namespaces, cgroups v2, overlayfs, seccomp, Wi-Fi)
            - Alpine 3.24 base with iproute2, nftables, fuse-overlayfs, wpa_supplicant
            - APK package manager with edge repos

            ### Quick Start
            ```bash
            tar xzf dokios-minirootfs-x86_64.tar.gz -C rootfs/
            chroot rootfs /bin/ash
            ```
          files: release/*
          prerelease: false
