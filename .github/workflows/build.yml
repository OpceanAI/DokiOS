name: Build and Release Dokios

on:
  push:
    branches: [main, doki-os]
    tags: ['dokios-v*']
  workflow_dispatch:

concurrency:
  group: dokios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: Build Kernel (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
          - arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.arch }}
          branch: edge
          packages: >
            build-base bc bison flex openssl-dev elfutils-dev
            gmp-dev mpc1-dev mpfr-dev perl linux-headers
            findutils diffutils installkernel zstd python3 pahole sed
          shell-name: alpine.sh

      - name: Compile kernel
        shell: alpine.sh {0}
        run: |
          set -e
          KVER="7.1.0"
          MAJ="${KVER%%.*}"
          echo "=== Downloading kernel $KVER ==="
          wget -q https://cdn.kernel.org/pub/linux/kernel/v${MAJ}.x/linux-${KVER%.*}.tar.xz
          tar xf linux-${KVER%.*}.tar.xz
          cd linux-${KVER%.*}
          
          echo "=== Configuring ==="
          cp $GITHUB_WORKSPACE/doki/doki-os-kernel/doki-os.${{ matrix.arch }}.config .config
          case "${{ matrix.arch }}" in
            x86_64)  KARCH="x86_64" ;;
            aarch64) KARCH="arm64"  ;;
            *)       KARCH="${{ matrix.arch }}" ;;
          esac
          make ARCH=$KARCH olddefconfig
          
          echo "=== Building ==="
          make ARCH=$KARCH -j$(nproc) 2>&1 | tail -20
          
          echo "=== Result ==="
          find arch/$KARCH/boot -type f \( -name "Image*" -o -name "bzImage" -o -name "zImage" -o -name "vmlinux" \) -ls
          mkdir -p output
          cp arch/$KARCH/boot/Image* arch/$KARCH/boot/bzImage arch/$KARCH/boot/zImage arch/$KARCH/boot/vmlinux output/ 2>/dev/null || true
          cp System.map output/ 2>/dev/null || true
          cp .config output/config 2>/dev/null || true
          ls -lh output/

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: linux-7.1/output/
          retention-days: 30

  build-rootfs:
    name: Build Rootfs (${{ matrix.arch }})
    needs: build-kernel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.arch }}
          branch: edge
          packages: bash
          shell-name: alpine.sh

      - name: Build rootfs
        shell: alpine.sh {0}
        run: |
          mkdir -p output
          $GITHUB_WORKSPACE/scripts/genrootfs.sh \
            -a ${{ matrix.arch }} \
            -o output/dokios-minirootfs-${{ matrix.arch }}.tar.gz \
            busybox alpine-baselayout alpine-keys alpine-release apk-tools musl-utils \
            iproute2 nftables fuse-overlayfs wireless-tools wpa_supplicant ca-certificates-bundle 2>&1 | tail -5
          ls -lh output/

      - name: Upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: dokios-${{ matrix.arch }}
          path: output/
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/dokios-v')
    needs: build-rootfs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release/
          pattern: dokios-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "doki-OS v0.1"
          body: |
            ## doki-OS v0.1 — Container-Optimized OS
            
            Based on Alpine Linux 3.24 with Linux Kernel 7.1.
            
            ### Included
            - **Kernel 7.1** compiled with `make` on Alpine edge
            - Container features: namespaces, cgroups v2, overlayfs, seccomp, Landlock
            - Wi-Fi: iwlwifi, ath10k, mt76, rtw88, brcmfmac (modules)
            - Alpine rootfs with iproute2, nftables, fuse-overlayfs, wpa_supplicant
            
            ### Quick Start
            ```bash
            tar xzf dokios-minirootfs-x86_64.tar.gz -C rootfs/
            chroot rootfs /bin/ash
            ```
          files: release/*
          prerelease: false
