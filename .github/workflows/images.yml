name: Build Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Create release'
        type: boolean
        default: false

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build ${{ matrix.profile }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            profile: doki_os_initramfs
          - arch: x86_64
            runner: ubuntu-latest
            profile: doki_os_vm
          - arch: aarch64
            runner: ubuntu-24.04-arm
            profile: doki_os_initramfs
          - arch: aarch64
            runner: ubuntu-24.04-arm
            profile: doki_os_vm
    container:
      image: alpine:3.24
      options: --privileged
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            alpine-conf apk-tools busybox fakeroot \
            syslinux xorriso grub grub-efi mtools \
            dosfstools squashfs-tools e2fsprogs cpio \
            git bash sudo

      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: packages/
        continue-on-error: true

      - name: Build image
        run: |
          mkdir -p output
          ./scripts/mkimage.sh \
            --arch ${{ matrix.arch }} \
            --profile ${{ matrix.profile }} \
            --repository ./packages/main/${{ matrix.arch }} \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/main \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/community \
            --outdir output/ \
            --tag ${{ github.sha }}

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.profile }}-${{ matrix.arch }}
          path: output/
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all images
        uses: actions/download-artifact@v4
        with:
          path: release/
          pattern: image-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          sha512sum * > SHA512SUMS.txt

      - name: Sign releases
        if: env.GPG_KEY != ''
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_KEY" | gpg --batch --import
          cd release
          for f in *.tar.gz *.img.gz; do
            [ -f "$f" ] || continue
            echo "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign "$f"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
